# YASB v2 status bar configuration for the Komorebi window manager setup.
# Docs: https://github.com/amnweb/yasb/wiki

bars:
  status-bar:
    enabled: true
    screens:
      - "*"
    style: "bar"
    alignment:
      position: "top"
      align: "center"
    dimensions:
      width: "100%"
      height: 36
    padding:
      top: 4
      left: 4
      bottom: 0
      right: 4
    animation:
      enabled: true
      duration: 500
    blur_effect:
      enabled: false
      dark_mode: true
      round_corners: false
    window_flags:
      always_on_top: true
      windows_app_bar: true
      hide_on_fullscreen: true # real fullscreen (video F11, juegos exclusivos) baja la barra a HWND_BOTTOM
    widgets:
      left:
        - "komorebi_workspaces"
      center:
        - "audio_visualizer"
      right:
        - "grouper_sysinfo"
        - "opencode_go"
        - "grouper_actions"

widgets:
  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "Komorebi Offline"
      label_workspace_btn: "•"
      label_workspace_active_btn: "●"
      label_workspace_populated_btn: "•"
      label_zero_index: false
      hide_empty_workspaces: false
      hide_if_offline: true
      enable_scroll_switching: true
      reverse_scroll_direction: false
      app_icons:
        enabled_populated: false
        enabled_active: false
        size: 16
        max_icons: 1
        hide_label: true
        hide_duplicates: true
        hide_floating: true

  # Layout pill (BSP) — currently NOT shown in the bar. Add "komorebi_active_layout"
  # back to bars.status-bar.widgets.left to restore it.
  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{layout_name}"
      layouts:
        - "bsp"
        - "columns"
        - "rows"
        - "grid"
        - "scrolling"
        - "vertical_stack"
        - "horizontal_stack"
        - "ultrawide_vertical_stack"
        - "right_main_vertical_stack"
      callbacks:
        on_left: "toggle_layout_menu"
        on_middle: "next_layout"
        on_right: "prev_layout"
      layout_menu:
        blur: true
        round_corners: true

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%H:%M}" # just the time; the full date lives in the hover tooltip
      label_alt: "{%H:%M:%S}"
      locale: "es_ES" # month names in Spanish
      update_interval: 1000
      # v2.0.7 hardcodes the tooltip contents (full date, day abbrev, time, zone)
      # and offers no custom format, so the hover is off; the left click still
      # opens the calendar popup.
      tooltip: false
      calendar:
        blur: true
        round_corners: true

  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      icon_size: 16
      pin_click_modifier: "alt"
      show_unpinned: false # unpinned icons start collapsed
      show_unpinned_button: true # ▾ button toggles the unpinned icons
      use_hook: false

  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "\uf011"
      uptime: false
      show_user: false
      menu_style: "popup"
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
      buttons:
        restart: ["\uead2", "Restart"]
        shutdown: ["\uf011", "Shut Down"]
        sleep: ["\u23fe", "Sleep"]
        lock: ["\uea75", "Lock"]
        hibernate: ["\uf28e", "Hibernate"]
        cancel: ["", "Cancel"]

  # --- Center pill: the audio visualizer ALONE (2026-10-07) -------------------
  # Retired here: the old group [audio_visualizer + media_lite, hide_empty: true]
  # always left an empty pill when silent. YASB v2.0.7 (main too) hides the grouper
  # only when every child reports isHidden(), and the audio visualizer never hides:
  # by design it COLLAPSES to 0 px on idle so it keeps the shared WASAPI stream
  # alive. The collapse renders nothing, so the visualizer alone leaves the center
  # empty when nothing plays - no grouper needed.
  # media_lite went with the group. Its popup cannot be wired to the visualizer's
  # click: callbacks are per widget in v2.0.7 and the visualizer registers none
  # (only default/do_nothing/exec), so "click the visualizer -> media menu" is not
  # expressible in config. Reinstating it means either a separate media pill or an
  # upstream change (cross-widget callbacks, or a grouper that treats a collapsed
  # child as hidden).

  audio_visualizer:
    type: "yasb.audio_visualizer.AudioVisualizerWidget"
    options:
      class_name: "audio-viz"
      style: "bars"
      height: 18
      smoothness: 70
      # auto_gain: false is REQUIRED for hide_idle to work: the adaptive gain keeps
      # amplifying silence, so the idle detector never sees a zero level and the widget
      # never collapses (observed 2026-10-06). Sensitivity becomes a plain multiplier
      # (50 = 1x), so it is raised to 70 (~1.4x) to keep quiet playback lively.
      sensitivity: 70
      auto_gain: false
      framerate: 60
      freq_min: 500
      freq_max: 12000
      hide_idle: true
      hide_idle_after: 1500
      channels: "mono"
      mono_option: "average"
      bars:
        count: 16
        width: 2
        gap: 3

  # --- System info group: CPU + MEM + GPU + traffic (collapsible pill) ---
  grouper_sysinfo:
    type: "yasb.grouper.GrouperWidget"
    options:
      widgets:
        - "cpu"
        - "memory"
        - "gpu"
      collapse_options:
        enabled: false # always expanded, not collapsible

  # Right-end cluster: tray icons (collapsed ▾) | clock | power button.
  grouper_actions:
    type: "yasb.grouper.GrouperWidget"
    options:
      widgets:
        - "systray"
        - "clock"
        - "power_menu"
      collapse_options:
        enabled: false # always expanded, not collapsible

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span class=\"icon\">\uf2db</span> {info[percent][total]}%" # icon kept, freq dropped
      label_alt: "<span class=\"icon\">\uf2db</span> {info[percent][total]}%"
      update_interval: 2000
      menu:
        enabled: false

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span class=\"icon\">\uefc5</span> {virtual_mem_percent}%"
      label_alt: "<span class=\"icon\">\uefc5</span> VIRT {virtual_mem_percent}% SWAP {swap_mem_percent}%"
      update_interval: 3000
      menu:
        enabled: false

  gpu:
    type: "yasb.gpu.GpuWidget"
    options:
      label: "<span class=\"icon\">\uf108</span> {info[utilization]}% · {info[temp]}°C" # icon U+F108 fa-desktop (was fa-flash)
      label_alt: "<span class=\"icon\">\uf108</span> {info[utilization]}% | {info[mem_used]}/{info[mem_total]}"
      update_interval: 3000
      menu:
        enabled: false

  traffic:
    type: "yasb.traffic.TrafficWidget"
    options:
      label: "<span class=\"icon\">\uf019</span> {download_speed} <span class=\"icon\">\uf093</span> {upload_speed}"
      label_alt: "{download_speed} | {upload_speed}"
      update_interval: 1000

  # Volume widget (system volume) — user chose NOT to use it; keep for reference.
  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "{level}"
      mute_text: "mute"
      callbacks:
        on_left: "toggle_volume_menu"
        on_middle: "do_nothing"
        on_right: "toggle_mute"
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_apps: true
        show_app_labels: true
        show_app_icons: true
        show_apps_expanded: false

  # Active window title widget — removed at the user's request.
  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_no_window: ""
      label_icon: true
      label_icon_size: 16
      max_length: 52
      max_length_ellipsis: "..."
      monitor_exclusive: true

  # Custom widget for OpenCode Go (5h, weekly, monthly stats) — user added it to the bar.
  opencode_go:
    type: "yasb.custom.CustomWidget"
    options:
      # The whole state-dependent line comes from the script as {data[text]}
      # (opencode_go.py -> label_text), because the left click rotates four states and
      # the template cannot: full (5h + W + M) -> only 5h -> only Week -> only Month ->
      # full (the single states spell the words out; the full one abbreviates).
      # The script owns the <font> spans for the ▰/▱ bars (CaskaydiaCove NFP, the family
      # that owns the glyphs, and the muted icon gray). The icon span is the 8x10 logo
      # (qproperty-pixmap in styles.css).
      label: '<span class="icon"></span> {data[text]}'
      label_alt: '<span class="icon"></span> {data[text]}'
      label_placeholder: "--"
      class_name: "opencode-go-widget"
      tooltip: false # no hover response: nothing appears on mouse-over
      exec_options:
        # `py`, not `python`: on this machine the Microsoft Store app-execution alias owns
        # `python`, so that stub fails with a "Python not found" error even though a real
        # interpreter is installed (C:\Python310, verified 2026-10-06). The Windows Python
        # launcher resolves the installed interpreter on both machines.
        run_cmd: 'py %USERPROFILE%\.config\yasb\opencode_go.py'
        # 1 s so the click's state change paints almost instantly; each tick only
        # reads local state/cache files and questions the API when the 15-min cache
        # is stale.
        run_interval: 1000
        return_format: "json"
        hide_empty: false
        use_shell: true
      callbacks:
        # Left click rotates the pill state: the script's --next writes
        # %TEMP%\opencode-go-usage.state and the widget's next tick (1 s) paints it.
        on_left: 'exec py %USERPROFILE%\.config\yasb\opencode_go.py --next'
        on_middle: "do_nothing"
        # Right click opens the OpenCode Go dashboard (this account's console page) in
        # the default browser. YASB runs `exec` as `Popen(args, shell=True)` after
        # tokenizing the string with `".+?"|[^ ]+` and stripping the quotes, so
        # `start "" "url"` reaches cmd as `start " " url`: the title slot holds a
        # single space (the regex eats the empty ""), which `start` still accepts, and
        # the URL stays the target. Without that first quoted argument `start` would
        # treat the URL itself as the window title and open a console instead of the
        # browser (measured on this machine). The URL must stay quoted and space-free.
        on_right: 'exec start "" "https://opencode.ai/console/wrk_01KR0RFFBT5FCG3YTKPGW9JTSB"'
